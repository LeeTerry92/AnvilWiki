# Content pipeline — scheduled freshness audit (v1.8).
#
# The static-site freshness problem: content only changes when someone
# commits. This workflow decouples "noticing what's stale" from the author
# being online: it runs a deterministic audit every Monday 09:00 (Beijing)
# and files a tracking issue. It NEVER mutates content or pushes commits —
# fixing stays a human (or AI-session) decision, so the PR-gated safety
# contract is untouched.
#
# Manual run: Actions → Content freshness audit → Run workflow.

name: Content freshness audit

on:
  schedule:
    - cron: '0 1 * * 1' # Mondays 01:00 UTC = 09:00 Beijing
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize runs: two overlapping audits would each close "the previous"
# issue mid-flight and could leave a half-closed/half-open pair. Keep
# cancel-in-progress false — an in-flight audit finishes and files its issue;
# a queued re-run then supersedes it with fresher data.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  audit:
    # Upstream-only: forks shouldn't get weekly issue spam about the demo
    # content. Delete this `if` (or change the repo name) to enable on a fork.
    if: github.repository == 'PNGTRID/AnvilWiki'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11.1.1
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run freshness audit
        # shell: bash opts into `bash -eo pipefail` — without pipefail the
        # pipeline exit code would come from tee and mask audit failures.
        shell: bash
        run: pnpm refresh-audit | tee /tmp/audit.md

      - name: File tracking issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single evergreen issue: close the previous AUDIT issue, open a fresh
          # one. Runs only when the audit itself succeeded — a failed audit would
          # otherwise file an empty-body issue and mask the failure.
          # The --search matches title SUBSTRINGS, so filter on the exact title
          # this workflow files ("Content freshness audit — YYYY-MM-DD") BEFORE
          # picking the first hit: an unrelated issue whose title merely contains
          # the phrase must never be closed by a robot. No exact match → warn
          # and close nothing.
          ISSUE_URL=$(gh issue list --search "in:title \"Content freshness audit\"" --json url,title --jq 'map(select(.title | test("^Content freshness audit — [0-9]{4}-[0-9]{2}-[0-9]{2}$"))) | first | .url // empty') || true
          if [ -n "$ISSUE_URL" ]; then
            gh issue close "$ISSUE_URL" --reason completed || true
          else
            echo "::warning::no previous issue with the exact audit title shape — nothing closed"
          fi
          # The script prints surrounding blank lines; trim to markdown body.
          BODY=$(sed -n '/^## Content freshness audit/,$p' /tmp/audit.md)
          if [ -z "$BODY" ]; then
            echo "Audit produced no report body — skipping issue creation."
            exit 0
          fi
          # The issue IS this workflow's only output, so a create failure
          # (API / rate limit / auth) must fail the step. The old `|| echo`
          # rationale ("maybe no changes worth filing") described a case the
          # empty-body guard above already exits on — all it actually
          # swallowed was real breakage, and with the previous issue already
          # closed the evergreen chain silently lost a week. Same loud
          # ::warning:: channel as the no-previous-issue case above.
          gh issue create \
            --title "Content freshness audit — $(date +%F)" \
            --body "$BODY" \
            || { echo "::warning::issue create failed — this week's audit issue is missing"; exit 1; }
