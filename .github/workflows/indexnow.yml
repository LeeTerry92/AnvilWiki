name: IndexNow

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  submit:
    # Optional by default: forks that do not configure both repository
    # variables pay zero runtime cost. Only successful PUSH builds on main
    # can notify IndexNow; pull-request CI never submits URLs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.SITE_URL != '' &&
      vars.INDEXNOW_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Submit production sitemap to IndexNow
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          pnpm submit-indexnow -- --site "$SITE_URL"
          --wait-for-deploy "$DEPLOY_SHA" --wait-for-key
          --wait-seconds 150
